name: Android Build

on:
  push:
    branches:
      - main
      - master

# Cancel superseded runs on the same branch so a rapid string of pushes
# doesn't queue up multiple full signed builds.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign & upload release APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Generate the Gradle wrapper if it isn't committed ──
      #
      # A fresh checkout of this project (see README) doesn't ship
      # gradlew/gradlew.bat/gradle-wrapper.jar — only gradle-wrapper.properties
      # (which pins the version below) is committed. setup-gradle above put a
      # real `gradle` binary on PATH, so this regenerates the wrapper here
      # rather than requiring a local `gradle wrapper` run first. Once the
      # wrapper files ARE committed to the repo, this step is a no-op — it
      # only acts when gradlew is missing, so it never fights a version you've
      # deliberately pinned differently in the committed wrapper.
      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "No committed gradlew — bootstrapping the wrapper with gradle 8.9."
            gradle wrapper --gradle-version 8.9
          else
            echo "gradlew already committed — using it as-is."
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # ── Decode the base64-encoded release keystore from secrets ──
      #
      # KEYSTORE_BASE64 is the .jks file, base64-encoded, e.g.:
      #   base64 -i release.jks | tr -d '\n' | pbcopy   (macOS)
      #   base64 -w0 release.jks                          (Linux)
      # Written to a runner-local path outside the repo checkout, and
      # RELEASE_STORE_FILE (its path) plus the other three secrets are
      # passed to Gradle purely as environment variables — app/build.gradle.kts
      # reads them via System.getenv() and never has them hardcoded.
      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot produce a signed build."
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build signed release AAB (App Bundle)
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # Remove the decoded keystore from the runner's temp dir as soon as
      # both build tasks are done, regardless of whether they succeeded —
      # RUNNER_TEMP is wiped between jobs anyway, but no reason to leave a
      # decoded private key sitting around any longer than necessary.
      - name: Clean up decoded keystore
        if: always()
        run: rm -f "${{ steps.keystore.outputs.path }}"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: psrm-forms-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: psrm-forms-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
